[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bquant"
version = "0.1.0"
description = "Group 13 convertible-bond quantitative research: verified data foundation (B0), CRR-tree pricing, stock-bond linkage, holding-path risk, and six-month market-performance prediction with walk-forward calibration."
requires-python = ">=3.12"
dependencies = [
  "QuantLib==1.43",
  "numpy==2.5.3",
  "pandas==3.0.6",
  "scipy==1.18.1",
  "statsmodels==0.15.0",
  "matplotlib==3.11.2",
]

[tool.setuptools.packages.find]
where = ["src"]
